<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Subjects</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        /* TOPBAR */

        .topbar {
            background: white;
            padding: 20px;

            border-radius: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .topbar h1 {
            color: #1e293b;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 10px;
        }

        .buttons a {
            color: white;

            text-decoration: none;

            font-weight: bold;

            padding: 11px 18px;

            border-radius: 6px;
        }

        .dashboard {
            background: #2563eb;
        }

        .dashboard:hover {
            background: #1d4ed8;
        }

        .logout {
            background: #dc2626;
        }

        .logout:hover {
            background: #b91c1c;
        }

        /* BREADCRUMB */

        .breadcrumb {
            margin-bottom: 20px;

            color: #64748b;
        }

        .breadcrumb a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .breadcrumb b {
            color: #1e293b;
        }

        /* SUBJECT CARDS */

        .subject-container {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 20px;
        }

        .subject-card {
            background: white;

            padding: 20px;

            border-radius: 10px;

            border-left: 5px solid #2563eb;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .subject-card h2 {
            color: #1e293b;

            margin-bottom: 10px;
        }

        .subject-card p {
            color: #64748b;

            margin-bottom: 5px;
        }

        .subject-number {
            color: #2563eb;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .course-name {
            font-weight: bold;

            color: #475569;
        }

        .empty {
            background: white;

            padding: 20px;

            border-radius: 10px;

            color: #64748b;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- TOPBAR -->

    <div class="topbar">

        <h1>
            Subjects
        </h1>


        <div class="buttons">

            <a
                href="{% url 'dashboard' %}"
                class="dashboard"
            >
                Dashboard
            </a>

            <a
                href="{% url 'logout' %}"
                class="logout"
            >
                Logout
            </a>

        </div>

    </div>


    <!-- BREADCRUMB -->

    <div class="breadcrumb">

        <a href="{% url 'dashboard' %}">
            Home
        </a>

        /

        <b>
            Subjects
        </b>

    </div>


    <!-- SUBJECT CARDS -->

    <div class="subject-container">


        {% for subject in subjects %}


        <div class="subject-card">


            <div class="subject-number">

                Subject {{ forloop.counter }}

            </div>


            <h2>

                {{ subject.name }}

            </h2>


            <p>

                Course:

                <span class="course-name">

                    {{ subject.course }}

                </span>

            </p>


        </div>


        {% empty %}


        <div class="empty">

            No subjects found.

        </div>


        {% endfor %}


    </div>


</div>


</body>

</html>
