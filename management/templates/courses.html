<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courses</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .topbar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .topbar h1 {
            color: #1e293b;
        }

        .buttons a {
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            color: white;
            margin-left: 8px;
        }

        .dashboard {
            background: #2563eb;
        }

        .logout {
            background: #dc2626;
        }

        .breadcrumb {
            margin-bottom: 20px;
            color: #64748b;
        }

        .breadcrumb a {
            text-decoration: none;
            color: #2563eb;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #1e293b;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: red;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">


    <!-- Topbar -->

    <div class="topbar">

        <h1>Courses</h1>

        <div class="buttons">

            <a
                href="{% url 'dashboard' %}"
                class="dashboard"
            >
                Dashboard
            </a>

            <a
                href="{% url 'logout' %}"
                class="logout"
            >
                Logout
            </a>

        </div>

    </div>


    <!-- Breadcrumb -->

    <div class="breadcrumb">

        <a href="{% url 'dashboard' %}">
            Home
        </a>

        /

        <b>Courses</b>

    </div>


    <!-- Courses Table -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>#</th>

                    <th>Course Name</th>

                    <th>Description</th>

                    <th>Status</th>

                </tr>

            </thead>


            <tbody>

                {% for course in courses %}

                <tr>

                    <td>
                        {{ forloop.counter }}
                    </td>

                    <td>
                        {{ course.name }}
                    </td>

                    <td>
                        {{ course.description }}
                    </td>

                    <td>

                        {% if course.is_active %}

                            <span class="active">
                                Active
                            </span>

                        {% else %}

                            <span class="inactive">
                                Inactive
                            </span>

                        {% endif %}

                    </td>

                </tr>

                {% empty %}

                <tr>

                    <td colspan="4">
                        No courses found.
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>


</div>

</body>

</html>
