<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .topbar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .topbar h1 {
            color: #1e293b;
        }

        .buttons a {
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            color: white;
            margin-left: 8px;
        }

        .dashboard {
            background: #2563eb;
        }

        .logout {
            background: #dc2626;
        }

        .breadcrumb {
            margin-bottom: 20px;
            color: #64748b;
        }

        .breadcrumb a {
            text-decoration: none;
            color: #2563eb;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #1e293b;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        .number {
            width: 70px;
        }

    </style>

</head>


<body>

<div class="container">


    <!-- Topbar -->

    <div class="topbar">

        <h1>Students</h1>

        <div class="buttons">

            <a
                href="{% url 'dashboard' %}"
                class="dashboard"
            >
                Dashboard
            </a>

            <a
                href="{% url 'logout' %}"
                class="logout"
            >
                Logout
            </a>

        </div>

    </div>


    <!-- Breadcrumb -->

    <div class="breadcrumb">

        <a href="{% url 'dashboard' %}">
            Home
        </a>

        /

        <b>Students</b>

    </div>


    <!-- Student Table -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th class="number">
                        #
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Phone
                    </th>

                    <th>
                        Address
                    </th>

                </tr>

            </thead>


            <tbody>

                {% for student in students %}

                <tr>

                    <td>
                        {{ forloop.counter }}
                    </td>

                    <td>
                        {{ student.name }}
                    </td>

                    <td>
                        {{ student.email }}
                    </td>

                    <td>
                        {{ student.phone }}
                    </td>

                    <td>
                        {{ student.address }}
                    </td>

                </tr>

                {% empty %}

                <tr>

                    <td colspan="5">
                        No students found.
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>


</div>

</body>

</html>
